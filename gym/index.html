const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256"},
                                 base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function open_(key) {
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BLOB.nonce)}, key, b64(BLOB.ct));
  const got = JSON.parse(new TextDecoder().decode(pt));
  const doc = new DOMParser().parseFromString(got.html, "text/html");
  document.head.innerHTML = doc.head.innerHTML;
  document.body.innerHTML = doc.body.innerHTML;
  document.querySelectorAll("a.gpx").forEach(a => {
    const name = a.getAttribute("href"), text = got.files[name];
    if (text === undefined) { a.remove(); return; }
    a.href = URL.createObjectURL(new Blob([text], {type: "application/gpx+xml"}));
    a.setAttribute("download", name);
  });
}
(async () => {
  let kept = null;
  try { kept = localStorage.getItem("fieldcard.key." + BLOB.salt); } catch (e) {}
  if (kept) {
    try { await open_(await crypto.subtle.importKey("jwk", JSON.parse(kept), {name: "AES-GCM"}, true, ["decrypt"])); return; }
    catch (e) { try { localStorage.removeItem("fieldcard.key." + BLOB.salt); } catch (e2) {} }
  }
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const remember = document.getElementById("r").checked;   // read now: opening replaces the form
    document.getElementById("e").textContent = "Opening\u2026";
    let key;
    try {
      key = await keyFrom(document.getElementById("p").value);
      await open_(key);
    } catch (e) { document.getElementById("e").textContent = "That passphrase does not open it."; return; }
    if (remember) {
      try { localStorage.setItem("fieldcard.key." + BLOB.salt, JSON.stringify(await crypto.subtle.exportKey("jwk", key))); } catch (e) {}
    }
  });
})();
